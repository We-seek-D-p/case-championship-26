[project]
name = "redwings-case-analysis"
version = "0.1.0"
description = "Воспроизводимое исследование маршрутной стратегии Red Wings"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "scipy>=1.17,<2",
    "matplotlib>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.uv]
package = false
